[package]
name = "ood-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
chrono = "0.4.42"
clap = { version = "4.5.40", features = ["derive"] }
futures = "0.3.31"
k8s-openapi = { version = "0.26.0", features = ["v1_33","schemars"] }
kube = { version = "2.0.1", features = ["derive", "runtime"] }
kube-derive = "2.0.1"
kube-runtime = "2.0.1"
schemars = "1.0.5"
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.release]
lto = "off"
debug = "none"
