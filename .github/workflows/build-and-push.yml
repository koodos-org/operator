name: Build and Push Multiple Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build operator compatible OOD image
        uses: docker/build-push-action@v6
        with:
          context: ./operator-image
          file: ./operator-image/Containerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/operator-image:latest
            ghcr.io/${{ github.repository_owner }}/operator-image:${{ github.sha }}

      - name: Build operator image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Containerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/koodos-operator:latest
            ghcr.io/${{ github.repository_owner }}/koodos-operator:${{ github.sha }}
